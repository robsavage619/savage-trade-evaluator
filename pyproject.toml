[project]
name = "savage-trade-evaluator"
version = "0.1.0"
description = "Context-aware MLB trade valuation. Backtester + multilevel Bayesian model."
readme = "README.md"
authors = [
    { name = "Rob Savage", email = "63321971+robsavage619@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "arviz>=1.1.0",
    "duckdb>=1.1",
    "h5netcdf>=1.8.1",
    "h5py>=3.16.0",
    "httpx>=0.27",
    "jinja2>=3.1.6",
    "pandas>=2.2",
    "plotly>=6.7.0",
    "polars>=1.10",
    "pyarrow>=17",
    "pybaseball>=2.2",
    "pydantic>=2.9",
    "pymc>=6.0.0",
    "scikit-learn>=1.9.0",
    "typer>=0.12",
]

[project.optional-dependencies]
# RAG over the research corpus. model2vec gives real static embeddings with no
# torch and no API key, so `ste research index/ask` runs cold after one clone.
rag = ["model2vec>=0.3"]

[dependency-groups]
dev = [
    "pyright>=1.1.380",
    "pytest>=8.3",
    "ruff>=0.6",
]

[project.scripts]
ste = "savage_trade_evaluator.cli:app"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle
    "F",      # pyflakes
    "I",      # isort
    "B",      # bugbear
    "UP",     # pyupgrade
    "SIM",    # simplify
    "RUF",    # ruff-specific
    "N",      # pep8-naming
    "D",      # pydocstyle (Google)
]
ignore = [
    "D100",   # missing docstring in module
    "D104",   # missing docstring in package
    "D203",   # 1-blank-line-before-class (conflicts with D211)
    "D213",   # multi-line-summary-second-line (conflicts with D212)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-bugbear]
# Typer uses call expressions (Option/Argument) as parameter defaults by design.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
# E402: sys.path bootstrap precedes imports. D: scripts don't need docstrings.
# E501: research scripts print wide fixed-width tables. RUF001/2/3: intentional
# typographic unicode (em-dashes, ×, β) in printed research output.
"scripts/*" = ["E402", "D", "E501", "RUF001", "RUF002", "RUF003"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["src", "tests"]
exclude = ["**/__pycache__", ".venv"]
